<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKS Takip</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <!-- Sol İkonik Sidebar -->
        <aside class="sidebar">
            <div class="logo-box">Y</div>
            <nav>
                <a href="#" class="active" title="Giriş / Kayıt"><i class="fa-solid fa-user"></i></a>
                <a href="#" title="Grafikler"><i class="fa-solid fa-chart-line"></i></a>
                <a href="#" title="Haftalık Plan"><i class="fa-solid fa-calendar-days"></i></a>
                <a href="#" title="Mesajlar"><i class="fa-solid fa-envelope"></i></a>
            </nav>
        </aside>

        <!-- Ana İçerik -->
        <main class="main-content">
            <div class="auth-card">
                
                <!-- GİRİŞ YAP FORMU -->
                <div id="loginFormSection">
                    <h2>Giriş Yap</h2>
                    <p class="auth-desc">Artık e-posta ve şifre ile giriş yapabilirsiniz.</p>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label>E-posta</label>
                            <input type="email" id="loginEmail" placeholder="ornek@mail.com" required>
                        </div>
                        <div class="form-group">
                            <label>Şifre</label>
                            <input type="password" id="loginPassword" placeholder="********" required>
                        </div>
                        <button type="submit" class="btn-submit">Giriş Yap</button>
                    </form>

                    <div class="auth-links">
                        <a href="javascript:void(0)" onclick="openRegister()">Hesabın yok mu? Kayıt Ol</a>
                    </div>
                </div>

                <!-- KAYIT OL FORMU (Başlangıçta Gizli) -->
                <div id="registerFormSection" style="display: none;">
                    <h2>Kayıt Ol</h2>
                    <p class="auth-desc">Aramıza katılmak için bilgilerini gir.</p>
                    
                    <form id="registerForm">
                        <div class="form-group">
                            <label>Ad Soyad</label>
                            <input type="text" id="regName" placeholder="Ad Soyad" required>
                        </div>
                        <div class="form-group">
                            <label>E-posta</label>
                            <input type="email" id="regEmail" placeholder="ornek@mail.com" required>
                        </div>
                        <div class="form-group">
                            <label>Telefon Numarası</label>
                            <input type="tel" id="regPhone" placeholder="05XXXXXXXXX" required>
                        </div>
                        <div class="form-group">
                            <label>Sınıf</label>
                            <select id="regGrade" required>
                                <option value="">Sınıf Seçiniz</option>
                                <option value="9">9. Sınıf</option>
                                <option value="10">10. Sınıf</option>
                                <option value="11">11. Sınıf</option>
                                <option value="12">12. Sınıf</option>
                                <option value="Mezun">Mezun</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Şifre Oluştur</label>
                            <input type="password" id="regPassword" placeholder="********" required>
                        </div>
                        <button type="submit" class="btn-submit">Kayıt Ol</button>
                    </form>

                    <div class="auth-links">
                        <a href="javascript:void(0)" onclick="openLogin()">Zaten hesabın var mı? Giriş Yap</a>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
